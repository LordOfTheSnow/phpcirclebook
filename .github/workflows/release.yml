name: Auto Release

# Auto-release-on-merge pattern, driven by composer.json's "version". Runs on every
# push to main; if composer.json's "version" doesn't have a matching git tag yet, this
# creates that tag + a GitHub Release (title is just the tag, e.g. "v0.9.0"; body from
# CHANGELOG.md's matching section) and triggers the FTP release zip build. If the
# version has already been released, this is a no-op -- most pushes to main won't bump
# the version.
#
# The downstream job is called directly via workflow_call rather than relying on the
# tag push itself to trigger it: a tag pushed by a workflow using the default
# GITHUB_TOKEN (as the "Create tag and release" step below does) does not fire other
# workflows' `on: push: tags:` triggers, so a plain tag push here would silently never
# reach ftp-release-zip.yml's own tag-push-style trigger.

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      new_release: ${{ steps.check_tag.outputs.exists == 'false' }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: version
        run: |
          VERSION=$(jq -r '.version' composer.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        id: changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract content between this version's heading and the next version heading
          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          # Write to file to preserve multiline content
          echo "$BODY" > /tmp/release_body.md

      - name: Create tag and release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ftp-zip:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    uses: ./.github/workflows/ftp-release-zip.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
